name: CI

# push-only: a `pull_request` trigger would run this job a second time (in a
# different concurrency group) for every push to a branch with an open PR,
# since the push-event run on the head commit already appears as a check on
# that PR.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"

jobs:
  core-linux:
    name: ReVoxCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: swift test
        working-directory: ReVoxCore
        run: swift test
      - name: Every ported constant is asserted
        run: bash scripts/ci/check-constant-coverage.sh

  ios-simulator:
    name: App and extension (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Verify Info.plists and privacy manifests
        run: python3 scripts/ci/check-plists.py

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh "$XCODE_VERSION"

      - name: ReVoxCore tests on macOS (Apple Foundation)
        working-directory: ReVoxCore
        run: swift test

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift package checkouts
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ReVoxMobile.xcodeproj \
            -scheme ReVoxMobile \
            -clonedSourcePackagesDirPath .spm

      - name: Show resolved package versions
        run: cat ReVoxMobile.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Pick simulator
        id: sim
        run: scripts/ci/pick-simulator.sh >> "$GITHUB_OUTPUT"

      - name: Build and test on the simulator
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project ReVoxMobile.xcodeproj \
            -scheme ReVoxMobile \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      # The bare target name appears while xcodebuild merely *builds* the package test bundle (the scheme's
      # Testables section forces that), so grep for the XCTest run banner instead: `tee` captures raw
      # xcodebuild output before xcbeautify, and only an executed suite prints `Test Suite 'ReVoxCoreTests…`.
      - name: Core tests ran on the simulator
        run: |
          grep -q "Test Suite 'ReVoxCoreTests" xcodebuild.log || {
            echo "::error::xcodebuild.log has no ReVoxCoreTests test suite; the package test target did not run on the simulator"
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            ReVoxMobile.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7
