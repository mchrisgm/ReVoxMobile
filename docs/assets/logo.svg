<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">ReVox Mobile mark</title>
  <defs>
    <!-- Same palette as docs/assets/banner.svg: navy into the app's accent #12788C. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A3A"/>
      <stop offset="0.6" stop-color="#0F5F6F"/>
      <stop offset="1" stop-color="#12788C"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FE3EC"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- A faint inner ring so the mark reads on both light and dark pages -->
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- The phrase: a symmetric waveform -->
  <g fill="url(#bars)">
    <rect x="46"  y="112" width="14" height="32"  rx="7"/>
    <rect x="72"  y="88"  width="14" height="80"  rx="7"/>
    <rect x="98"  y="60"  width="14" height="136" rx="7"/>
    <rect x="124" y="44"  width="14" height="168" rx="7"/>
    <rect x="150" y="76"  width="14" height="104" rx="7"/>
    <rect x="176" y="100" width="14" height="56"  rx="7"/>
  </g>
  <!-- The arrow: out comes the translation -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 198 128 H 220"/>
    <path d="M 206 112 L 222 128 L 206 144"/>
  </g>
</svg>
